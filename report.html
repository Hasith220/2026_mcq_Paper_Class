<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Student Report — 2026 O/L</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg: #0d0f14;
    --surface: #13161e;
    --surface2: #1a1e28;
    --border: #252a38;
    --accent: #4f9cf9;
    --success: #34d399;
    --danger: #f87171;
    --warning: #fbbf24;
    --purple: #a78bfa;
    --text: #e8eaf0;
    --muted: #6b7280;
    --mono: 'DM Mono', monospace;
    --sans: 'Sora', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    height: 100%;
  }
  body {
    padding: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .app { width: 100%; max-width: 1100px; margin: 0 auto; }

  /* Header */
  .header { text-align: center; margin-bottom: 0.9rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border); }
  .school-tag { display: inline-block; font-size: 9px; font-family: var(--mono); letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
  .student-name { font-size: 19px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
  .student-id { font-size: 11px; font-family: var(--mono); color: var(--muted); }

  /* Main layout — landscape 2 column */
  .main-grid {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 0.75rem;
    align-items: start;
  }
  .col { display: flex; flex-direction: column; gap: 0.75rem; }

  /* Stats row */
  .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 8px; text-align: center; }
  .stat-val { font-size: 19px; font-weight: 600; font-family: var(--mono); margin-bottom: 2px; line-height: 1; }
  .stat-label { font-size: 9px; letter-spacing: 0.5px; text-transform: uppercase; color: var(--muted); }
  .stat-card.avg .stat-val { color: var(--accent); }
  .stat-card.rank .stat-val { color: var(--warning); }
  .stat-card.papers .stat-val { color: var(--success); }
  .stat-card.predicted .stat-val { color: var(--purple); }

  /* Predicted breakdown mini */
  .predicted-card {
    grid-column: span 2;
    background: linear-gradient(135deg, rgba(167,139,250,0.08), rgba(79,156,249,0.05));
    border: 1px solid rgba(167,139,250,0.25);
  }
  .predicted-sub { display: flex; justify-content: center; gap: 14px; margin-top: 4px; font-size: 9px; font-family: var(--mono); color: var(--muted); }
  .predicted-sub span b { color: var(--text); }

  /* Chart */
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0.85rem; }
  .chart-title { font-size: 10px; font-family: var(--mono); letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .chart-wrap { position: relative; height: 195px; }

  /* MCQ breakdown */
  .breakdown-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0.85rem; max-height: 300px; overflow-y: auto; }
  .breakdown-title { font-size: 10px; font-family: var(--mono); letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .mcq-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); gap: 8px; }
  .mcq-row:last-child { border-bottom: none; padding-bottom: 0; }
  .mcq-name { font-size: 11px; font-family: var(--mono); color: var(--muted); width: 50px; flex-shrink: 0; }
  .mcq-bar-wrap { flex: 1; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .mcq-bar { height: 100%; border-radius: 3px; }
  .mcq-marks { font-size: 12px; font-family: var(--mono); font-weight: 500; width: 42px; text-align: right; flex-shrink: 0; }
  .mcq-rank { font-size: 10px; font-family: var(--mono); color: var(--muted); width: 32px; text-align: right; flex-shrink: 0; }

  /* Legend */
  .legend { display: flex; gap: 12px; margin-bottom: 8px; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 10px; font-family: var(--mono); color: var(--muted); }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

  /* Footer */
  .footer { text-align: center; font-size: 9px; font-family: var(--mono); color: var(--muted); margin-top: 0.6rem; }

  /* Loading / Error */
  .loading { text-align: center; padding: 3rem 1rem; }
  .loading-spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
  .loading p { font-size: 13px; color: var(--muted); font-family: var(--mono); }
  .error-box { background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.2); border-radius: 12px; padding: 1.5rem; text-align: center; }
  .error-box p { font-size: 13px; color: var(--danger); font-family: var(--mono); }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Small screens — stack vertically, allow scroll */
  @media (max-width: 700px) {
    body { align-items: flex-start; padding: 1.25rem 1rem 2rem; }
    .main-grid { grid-template-columns: 1fr; }
    .chart-wrap { height: 220px; }
    .breakdown-card { max-height: none; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading">
    <div class="loading-spinner"></div>
    <p>Loading report...</p>
  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbytk_Q1dGxMxeaNByjKftHFfGGQUj7vPkPcX-86pTCBOqXX-3lkXhxTSJXTaZAC6mwe/exec";

async function loadReport() {
  const params = new URLSearchParams(window.location.search);
  const studentId = params.get("id");
  const app = document.getElementById("app");

  if (!studentId) {
    app.innerHTML = `<div class="error-box"><p>No student ID provided.</p></div>`;
    return;
  }

  try {
    const res = await fetch(SCRIPT_URL + "?id=" + studentId);
    const data = await res.json();

    if (data.error) {
      app.innerHTML = `<div class="error-box"><p>Error: ${data.error}</p></div>`;
      return;
    }

    renderReport(data);
  } catch(err) {
    app.innerHTML = `<div class="error-box"><p>Failed to load report.<br/>${err.message}</p></div>`;
  }
}

function renderReport(data) {
  const app = document.getElementById("app");
  const mcqs = data.mcqData.filter(m => m.marks !== null);
  const paperCount = mcqs.length;

  function getFirstName(name) {
    const parts = name.split(" ");
    for (let i = 0; i < parts.length; i++) {
      if (!parts[i].includes(".") && parts[i].length > 2) return parts[i];
    }
    return parts[parts.length - 1];
  }

  // ── PREDICTED OVERALL MARK ──────────────────────────────
  // MCQ = out of 40, Essay predicted = same % applied to 60
  const mcqAvg = parseFloat(data.overallAvg) || 0;
  const mcqPct = mcqAvg / 40;
  const predictedEssay = Math.round(mcqPct * 60 * 10) / 10;
  const predictedTotal = Math.round((mcqAvg + predictedEssay) * 10) / 10;

  app.innerHTML = `
    <div class="header">
      <div class="school-tag">2026 O/L Paper Class · Hasith Sir</div>
      <div class="student-name">${data.name}</div>
      <div class="student-id">${data.id}</div>
    </div>

    <div class="main-grid">
      <div class="col">
        <div class="stats-row">
          <div class="stat-card avg">
            <div class="stat-val">${data.overallAvg}<span style="font-size:12px;opacity:0.5">/40</span></div>
            <div class="stat-label">MCQ Avg</div>
          </div>
          <div class="stat-card rank">
            <div class="stat-val">${data.rank}<span style="font-size:12px;opacity:0.5">/${data.totalStudents}</span></div>
            <div class="stat-label">Rank</div>
          </div>
          <div class="stat-card papers">
            <div class="stat-val">${paperCount}</div>
            <div class="stat-label">Papers Done</div>
          </div>
          <div class="stat-card predicted">
            <div class="stat-val">${predictedTotal}<span style="font-size:12px;opacity:0.5">/100</span></div>
            <div class="stat-label">Predicted Total</div>
          </div>
          <div class="stat-card predicted-card">
            <div class="stat-label" style="margin-bottom:4px">Predicted Breakdown</div>
            <div class="predicted-sub">
              <span>MCQ (40): <b>${mcqAvg}</b></span>
              <span>Essay (60, est.): <b>${predictedEssay}</b></span>
            </div>
          </div>
        </div>

        <div class="breakdown-card">
          <div class="breakdown-title">MCQ Breakdown</div>
          ${mcqs.map(m => {
            const pct = (m.marks / 40) * 100;
            const color = m.marks >= 31 ? '#34d399' : m.marks >= 21 ? '#4f9cf9' : m.marks >= 11 ? '#fbbf24' : '#f87171';
            return `<div class="mcq-row">
              <div class="mcq-name">${m.name}</div>
              <div class="mcq-bar-wrap"><div class="mcq-bar" style="width:${pct}%;background:${color}"></div></div>
              <div class="mcq-marks" style="color:${color}">${m.marks}/40</div>
              <div class="mcq-rank">#${m.rank}</div>
            </div>`;
          }).join('')}
        </div>
      </div>

      <div class="col">
        <div class="chart-card">
          <div class="chart-title">Performance Chart</div>
          <div class="legend">
            <div class="legend-item"><div class="legend-dot" style="background:#4f9cf9"></div>Your Marks</div>
            <div class="legend-item"><div class="legend-dot" style="background:#f87171;opacity:0.6"></div>Class Avg</div>
          </div>
          <div class="chart-wrap">
            <canvas id="chart"></canvas>
          </div>
        </div>
      </div>
    </div>

    <div class="footer">
      Generated by Hasith Sir · 2026 O/L Paper Class · Essay marks are an estimate based on MCQ performance
    </div>
  `;

  // Chart
  const labels   = data.mcqData.map(m => m.name);
  const marks    = data.mcqData.map(m => m.marks);
  const classAvg = data.mcqData.map(m => m.classAvg);

  new Chart(document.getElementById("chart"), {
    type: "bar",
    data: {
      labels,
      datasets: [
        {
          label: "Your Marks",
          data: marks,
          backgroundColor: marks.map(m =>
            m === null ? 'transparent' :
            m >= 31 ? 'rgba(52,211,153,0.8)' :
            m >= 21 ? 'rgba(79,156,249,0.8)' :
            m >= 11 ? 'rgba(251,191,36,0.8)' :
            'rgba(248,113,113,0.8)'
          ),
          borderRadius: 5,
          borderSkipped: false,
        },
        {
          label: "Class Avg",
          data: classAvg,
          type: "line",
          borderColor: "rgba(248,113,113,0.6)",
          backgroundColor: "transparent",
          borderWidth: 2,
          borderDash: [4,4],
          pointBackgroundColor: "rgba(248,113,113,0.8)",
          pointRadius: 3,
          tension: 0.3,
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => ctx.dataset.label + ": " + ctx.raw + "/40"
          }
        }
      },
      scales: {
        y: {
          min: 0, max: 40,
          ticks: { color: "#6b7280", font: { family: "DM Mono", size: 10 }, stepSize: 10 },
          grid: { color: "#252a38" },
          border: { display: false }
        },
        x: {
          ticks: { color: "#6b7280", font: { family: "DM Mono", size: 10 } },
          grid: { display: false },
          border: { display: false }
        }
      }
    }
  });
}

loadReport();
</script>
</body>
</html>
